# Perfil para correr sin Docker ni MySQL: SPRING_PROFILES_ACTIVE=h2
# Base H2 en archivo (backend/data/) en modo MySQL, con las mismas migraciones de Flyway.
# Sirve para desarrollar el front; para la entrega se usa MySQL.
spring:
  datasource:
    url: jdbc:h2:file:./data/esquina;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:

app:
  mail:
    habilitado: false   # sin Mailpit los emails solo se registran en el log
